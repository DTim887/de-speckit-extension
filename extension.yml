schema_version: "1.0"

extension:
  id: de-speckit-extension
  name: "DE Speckit Extension"
  version: "0.2.0"
  description: "DE's organization-wide Spec Kit extension"
  author: "Tim Jin"
  license: MIT
  repository: "https://github.com/DTim887/de-speckit-extension"
  homepage: "https://github.com/DTim887/de-speckit-extension"

requires:
  speckit_version: ">=0.2.0"
  tools: []

provides:
  commands:
    - name: speckit.de-speckit-extension.read-jira-ticket
      file: commands/speckit.de-speckit-extension.read-jira-ticket.md
      description: "Fetch a JIRA ticket's description (SHDRP-<number>) as plain text; also gates /speckit.specify on a valid ticket reference"

  config:
    - name: "de-speckit-extension-config.yml"
      template: "config-template.yml"
      description: "Per-project configuration for this extension's hooks"
      required: false

hooks:
  before_specify:
    command: speckit.de-speckit-extension.read-jira-ticket
    optional: false
    description: "Mandatory gate: require a valid SHDRP-<number> JIRA ticket reference and inject its description before /speckit.specify runs"

tags:
  - "custom"

defaults:
  enabled: true
